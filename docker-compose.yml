# Docker Compose for optional containerized local development
# Note: Docker is completely optional. Local native development (FastAPI + Vite) is recommended.
# Persistent vector storage is provided externally via Qdrant Cloud.
# No local databases (Redis, Postgres, local Qdrant) are required for baseline operation.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_rag_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=development
      - DEBUG=true
      - ADMIN_API_SECRET=${ADMIN_API_SECRET:-dev-admin-secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_GENERATION_MODEL=${GEMINI_GENERATION_MODEL:-gemini-2.5-flash}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-college_knowledge_base}
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:5174"]
    volumes:
      - ./backend:/app
    restart: unless-stopped

